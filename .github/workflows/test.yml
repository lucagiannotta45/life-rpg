# Life RPG — test automatici
# A ogni modifica caricata su GitHub (e a ogni pull request) lancia "node --test" (in quattro fusi orari)
# e mostra il risultato nella scheda "Actions" del repository.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:   # permette anche di lanciarli a mano dalla scheda "Actions"

jobs:
  test:
    runs-on: ubuntu-latest
    # gli stessi test con il "dispositivo" in fusi diversi: Italia, Brasile (indietro), Giappone (avanti)
    # e Kiritimati (UTC+14, il più avanti di tutti: lì "oggi" è spesso già domani rispetto all'Italia)
    strategy:
      fail-fast: false
      matrix:
        tz: [Europe/Rome, America/Sao_Paulo, Asia/Tokyo, Pacific/Kiritimati]
    name: test (${{ matrix.tz }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
        env:
          TEST_TZ: ${{ matrix.tz }}
